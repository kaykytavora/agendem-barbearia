<!DOCTYPE html>
<html>
<head>
    <title>SVG to PNG Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            background: #6c47ff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px 5px;
            font-size: 14px;
        }
        button:hover { background: #5a38f0; }
        .preview {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        canvas {
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            background: #e8f5e8;
            color: #2d5a2d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Conversor SVG → PNG para PWA</h1>
        <p>Clique nos botões para converter os ícones SVG em PNGs de alta qualidade:</p>

        <div>
            <button onclick="convertIcon(192)">Converter para 192x192 PNG</button>
            <button onclick="convertIcon(512)">Converter para 512x512 PNG</button>
            <button onclick="convertAll()">Converter Todos</button>
        </div>

        <div class="preview">
            <canvas id="canvas-192" width="192" height="192"></canvas>
            <canvas id="canvas-512" width="512" height="512"></canvas>
        </div>

        <div id="status" class="status" style="display: none;"></div>
    </div>

    <script>
        function showStatus(message) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 3000);
        }

        function createIconSVG(size) {
            return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-${size}" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c47ff"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Background circle with safe zone -->
  <circle cx="${size/2}" cy="${size/2}" r="${size*0.4}" fill="url(#bg-${size})"/>

  <!-- Letter A for Agendem -->
  <text x="${size/2}" y="${size/2 + size*0.08}"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-weight="bold"
        font-size="${size*0.25}"
        fill="white">A</text>

  <!-- Three dots representing appointments -->
  <circle cx="${size*0.35}" cy="${size*0.75}" r="${size*0.02}" fill="white" opacity="0.9"/>
  <circle cx="${size*0.5}" cy="${size*0.75}" r="${size*0.02}" fill="white" opacity="0.9"/>
  <circle cx="${size*0.65}" cy="${size*0.75}" r="${size*0.02}" fill="white" opacity="0.9"/>

  <!-- Small calendar icon -->
  <rect x="${size*0.42}" y="${size*0.2}" width="${size*0.16}" height="${size*0.12}" rx="${size*0.01}" fill="white" opacity="0.8"/>
  <rect x="${size*0.44}" y="${size*0.22}" width="${size*0.12}" height="${size*0.06}" rx="${size*0.005}" fill="#6c47ff"/>
</svg>`;
        }

        function convertIcon(size) {
            const canvas = document.getElementById(`canvas-${size}`);
            const ctx = canvas.getContext('2d');

            // Create SVG
            const svgData = createIconSVG(size);
            const svgBlob = new Blob([svgData], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(svgBlob);

            // Create image and draw to canvas
            const img = new Image();
            img.onload = function() {
                // Clear and draw
                ctx.clearRect(0, 0, size, size);
                ctx.drawImage(img, 0, 0, size, size);

                // Convert to PNG and download
                canvas.toBlob(function(blob) {
                    const pngUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = pngUrl;
                    a.download = `icon-${size}x${size}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(pngUrl);

                    showStatus(`✅ Ícone ${size}x${size} PNG gerado com sucesso!`);
                }, 'image/png', 1.0);

                URL.revokeObjectURL(url);
            };

            img.src = url;
        }

        function convertAll() {
            convertIcon(192);
            setTimeout(() => convertIcon(512), 1000);
        }

        // Generate previews on load
        window.addEventListener('load', function() {
            [192, 512].forEach(size => {
                const canvas = document.getElementById(`canvas-${size}`);
                const ctx = canvas.getContext('2d');

                const svgData = createIconSVG(size);
                const svgBlob = new Blob([svgData], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(svgBlob);

                const img = new Image();
                img.onload = function() {
                    ctx.drawImage(img, 0, 0, size, size);
                    URL.revokeObjectURL(url);
                };
                img.src = url;
            });
        });
    </script>
</body>
</html>
